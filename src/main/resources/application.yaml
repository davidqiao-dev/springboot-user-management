spring:
  application:
    name: springboot-user-management
  datasource:
    url: jdbc:mysql://localhost:3306/userdb
    username: root
    password: ${MYSQL840_PASS}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    properties:
      hibernate:
        format-sql: true

  data:
    redis:
      host: localhost
      port: 6379

info:
  app:
    name: User Management
    version: 1.0.0
    description: Spring Boot Redis Demo

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true