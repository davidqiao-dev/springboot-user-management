spring:
  application:
    name: springboot-user-management
  datasource:
    url: jdbc:mysql://localhost:3306/userdb
    username: root
    password: ${MYSQL_PASS}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    properties:
      hibernate:
        format-sql: true

  data:
    redis:
      host: localhost
      port: 6379